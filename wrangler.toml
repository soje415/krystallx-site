name = "krystallx-site"
pages_build_output_dir = "dist"

# The Anthropic SDK needs Node built-ins on the Workers runtime.
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Site backend. Independent of the analysis platform's Postgres by design —
# a lockout on one must not take down the other.
[[d1_databases]]
binding = "DB"
database_name = "krystallx-site"
database_id = "5d1847b1-826c-44f8-b1ed-f53a5c4976c6"
