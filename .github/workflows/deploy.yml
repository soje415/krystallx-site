name: Deploy to Cloudflare Pages

# Deploys on every push to main, including the daily commits the social
# workflow makes — so a newly generated card is publicly reachable, which is
# what Instagram needs before it will accept the post.
#
# This runs instead of Cloudflare's native Git integration: the project was
# created as a direct-upload project, and Cloudflare cannot convert one to
# Git-connected. Recreating it would discard the configured secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name krystallx-site \
            --branch main \
            --commit-dirty=true
