name: Daily social post

# 07:00 UTC = 08:00 WAT. GitHub's scheduler is best-effort and can run late
# under load; nothing here is time-critical, so that's acceptable.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Force a pillar (EXPLAINER, CAPABILITY, CONTEXT, MISSION, PROOF, ACTIVITY)'
        required: false
      days:
        description: 'How many days to generate'
        required: false
        default: '1'

# Needed so the run can commit the generated post back to the repo. That
# commit is also what keeps the scheduled workflow from being auto-disabled
# after 60 days of repository inactivity.
permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate, gate, render and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Whichever publisher is configured; absent = dry run.
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          node social/run.mjs \
            --days "${{ github.event.inputs.days || '1' }}" \
            ${{ github.event.inputs.pillar && format('--pillar {0}', github.event.inputs.pillar) || '' }}

      - name: Commit the queue
        run: |
          git config user.name  "krystallx-social"
          git config user.email "social@users.noreply.github.com"
          git add social/out public/cards
          # Nothing to commit is a normal outcome: every post may have been
          # killed by the OPSEC gate. Don't fail the run for it.
          git diff --staged --quiet || git commit -m "social: $(date -u +%Y-%m-%d) queue"
          git push

      - name: Upload cards as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_number }}
          path: public/cards/*.png
          if-no-files-found: ignore
          retention-days: 30
